<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Wanger个人存文站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #fdfdfd;
      color: #333;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px 20px;
      background-color: #1a73e8;
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .section-card {
      background-color: #f5f5f5;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .section-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .section-card a {
      text-decoration: none;
      color: #1a73e8;
      font-weight: bold;
      font-size: 18px;
      display: block;
      margin-top: 20px;
    }

    .section-card p {
      color: #555;
      font-size: 14px;
      margin-top: 10px;
    }

    @media (max-width: 500px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Wanger个人存文站</h1>
  <p>点击下方分区进入对应系列</p>
</header>

<main style="
    display: flex; /* 启用弹性布局 */
    flex-wrap: wrap; /* 允许卡片换行 */
    gap: 20px; /* 卡片之间的间距 */
    padding: 20px;
    max-width: 1200px; /* 限制整个内容区域的最大宽度 */
    margin: 0 auto; /* 使整个内容区域在PC端居中 */
">
    <style>
        .section-card {
            /* 基础样式 */
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            
            /* 宽度控制：在 PC 端，卡片宽度适应父容器，同时限制最小最大宽度 */
            flex-grow: 1; /* 允许卡片伸展 */
            flex-basis: 280px; /* 理想基础宽度，当宽度足够时每行显示多个 */
            max-width: 350px; /* 限制单张卡片最大宽度，防止文字被过度拉伸 */
            
            /* 高度控制：通过 padding 控制高度，同时满足移动端降低高度的要求 */
            padding: 15px; /* 移动端/小屏幕时的内边距，比默认值小 */
            
            /* 内部内容样式 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        /* 标题和文字样式 */
        .section-card h2 {
            font-size: 18px;
            margin-top: 0;
            color: #333;
        }
        .section-card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            /* 保证内容不会因文字太长而溢出 */
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 链接按钮样式 */
        .section-card a {
            display: inline-block;
            background-color: #007bff; /* 蓝色按钮 */
            color: white;
            padding: 6px 12px;
            text-align: center;
            border-radius: 4px;
            text-decoration: none;
            margin-top: auto; /* 将按钮推到底部 */
        }
        
        /* 鼠标悬停效果 */
        .section-card:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }

        .section-card.no-link p {
             margin-bottom: 0; /* 如果是最后一个没有链接的卡片，底部间距可以移除 */
        }
    </style>

<div class="section-card" style="
        /* 💥 核心修改：使用 background 叠加透明度层 💥 */
        /* 1. 添加一个 60% 透明度的深色叠加层 (rgba(0,0,0,0.4) 是 40% 不透明，60% 透明) */
        /* 2. 在其后添加背景图片，并设置 cover 和居中 */
        background: 
            linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
            url('reunion/bannner.jpg') center center / cover;
            
        /* 确保图片加载失败时，有一个备用的颜色（白色） */
        background-color: #fff; 
        
        /* 原始文字颜色不变，但我们需要覆盖卡片默认的白色背景，让图片显示 */
        background-blend-mode: multiply; /* 混合模式，确保叠加层生效 */
    ">
        <h2>【袁成】重逢</h2>
        <p>成才没有加入老A的故事线<br>全18章正文+3篇番外</p>
        <a href="reunion.html">进入分区</a>
    </div>

    <div class="section-card">
        <h2>【袁成】短篇文</h2>
        <p>短篇都是相互独立的<br>时间线和各自设定都很混乱</p>
        <a href="shorts.html">进入分区</a>
    </div>
    
    <div class="section-card">
        <h2>【袁成】老A日常系列</h2>
        <p>成才、许三多、吴哲、齐桓四人一个宿舍的背景<br>内容偏全员沙雕</p>
        <a href="daily.html">进入分区</a>
    </div>

    <div class="section-card">
        <h2>【袁成】老A版《走近科学》</h2>
        <p>沙雕灵异的科学事件</p>
        <a href="science.html">进入分区</a>
    </div>

    <div class="section-card">
        <h2>非袁成等杂文</h2>
        <p>包括其他CP和多CP等</p>
        <a href="other.html">进入分区</a>
    </div>
    
    <div class="section-card no-link">
        <h2>与我交流</h2>
        <p>QQ群：870206692<br>(加群请写备注)</p>
    </div>
</main>

</body>
</html>
