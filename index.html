<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Wanger个人存文站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      line-height: 1.8;
      padding: 20px;
      max-width: 700px;
      margin: auto;
      background-color: #fdfdfd;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      margin-bottom: 10px;
    }
    a {
      text-decoration: none;
      color: #1a73e8;
    }
    a:hover {
      text-decoration: underline;
    }
    #content {
      margin-top: 40px;
    }
    #content p {
      margin-bottom: 16px;
    }
    #passwordSection {
      margin-top: 20px;
      display: none;
    }
    input[type="password"] {
      padding: 5px;
      font-size: 16px;
    }
    button {
      padding: 5px 10px;
      font-size: 16px;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>小说目录</h1>
  <ul id="chapterList">
    <!-- 这里列出你的章节 -->
    <li><a href="#" data-file="Dogs, Humans, Heat, and Public Order.txt">Dogs, Humans, Heat, and Public Order</a></li>
    <!-- 可复制 li 标签添加更多章节 -->
    <!-- 如果某章是 R18，可以加 data-r18="true" -->
    <!-- <li><a href="#" data-file="chapterR18.txt" data-r18="true">秘密章节 (R18)</a></li> -->
  </ul>

  <div id="passwordSection">
    <label>请输入密码访问章节：</label>
    <input type="password" id="chapterPassword">
    <button onclick="checkPassword()">确认</button>
  </div>

  <div id="content">请选择章节开始阅读</div>

  <script>
    const chapterLinks = document.querySelectorAll('#chapterList a');
    let pendingR18 = null;

    chapterLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const file = link.getAttribute('data-file');
        const isR18 = link.getAttribute('data-r18') === 'true';

        if(isR18){
          // 显示密码输入框
          pendingR18 = file;
          document.getElementById('passwordSection').style.display = 'block';
        } else {
          loadChapter(file);
        }
      });
    });

    function checkPassword(){
      const pwd = document.getElementById('chapterPassword').value;
      // 这里你可以自定义密码，例如 '1234'
      if(pwd === '1234' && pendingR18){
        loadChapter(pendingR18);
        document.getElementById('passwordSection').style.display = 'none';
        document.getElementById('chapterPassword').value = '';
        pendingR18 = null;
      } else {
        alert('密码错误');
      }
    }

    function loadChapter(file){
      fetch(file)
        .then(response => response.text())
        .then(text => {
          const paragraphs = text.split('\n').filter(line => line.trim() !== '');
          document.getElementById('content').innerHTML =
            paragraphs.map(p => `<p>${p}</p>`).join('');
        })
        .catch(err => {
          document.getElementById('content').innerHTML = '加载失败：' + err;
        });
    }
  </script>
</body>
</html>
