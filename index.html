<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>我的小说站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #fdfdfd;
      color: #333;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px 20px;
      background-color: #1a73e8;
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .section-card {
      background-color: #f5f5f5;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .section-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .section-card a {
      text-decoration: none;
      color: #1a73e8;
      font-weight: bold;
      font-size: 18px;
      display: block;
      margin-top: 20px;
    }

    .section-card p {
      color: #555;
      font-size: 14px;
      margin-top: 10px;
    }

    @media (max-width: 500px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>我的小说站</h1>
  <p>点击下方分区进入对应系列</p>
</header>

<main>
  <div class="section-card">
    <h2>【袁成】重逢</h2>
    <p>主要讲述袁朗与成才的重逢故事，情感拉扯为主</p>
    <a href="reunion.html">进入分区</a>
  </div>

  <div class="section-card">
    <h2>【袁成】老A日常系列</h2>
    <p>记录老A队伍的日常欢乐和沙雕故事</p>
    <a href="daily.html">进入分区</a>
  </div>

  <div class="section-card">
    <h2>【袁成】老A版《走近科学》</h2>
    <p>以诡异事件+科学推理为主题的特种部队故事</p>
    <a href="science.html">进入分区</a>
  </div>

  <div class="section-card">
    <h2>【袁成】短篇文</h2>
    <p>零散短篇，轻松、暧昧或小段子合集</p>
    <a href="shorts.html">进入分区</a>
  </div>
</main>

</body>
</html>
