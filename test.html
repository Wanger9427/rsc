// --- 排序辅助函数：从 desc 中提取日期 YYMMDD ---
function extractDate(desc) {
    // 使用正则表达式匹配 [YYMMDD] 格式并提取日期数字
    const match = desc.match(/\[(\d{6})\]/);
    if (match && match[1]) {
        return parseInt(match[1]); // 返回整数，例如 251126
    }
    // 如果没有找到日期，返回 0，使其排在最末尾
    return 0; 
}

// --- 核心排序代码：按日期降序 (最近的在前) ---
chapters.sort((a, b) => {
    const dateA = extractDate(a.desc);
    const dateB = extractDate(b.desc);
    
    // 降序排序逻辑：
    // 如果 dateB > dateA，返回正数，将 B 排在 A 的前面 (即 B 更靠前/更近)
    return dateB - dateA;
});

  
// Valine加载，每次加载新文章时调用

}

function showRestrictedWarning() {
    return new Promise((resolve, reject) => {
        const message = "警告：此章节包含限制级内容，请确定您已年满18岁。";
        // 使用 confirm 弹出原生弹窗
        if (window.confirm(message)) {
            resolve(); // 用户点击“确认”
        } else {
            reject(); // 用户点击“取消”
        }
    });
}

// 新增搜索功能变量和元素引用
const chapterSearchInput = document.getElementById('chapterSearch');
let filteredChapters = chapters; // 初始时，过滤后的列表等于全部列表

// 获取已读章节集合 (从浏览器存储中读取)
function getReadChapters() {
  // localStorage 键，使用 'readChapters_other' 
  const readChaptersJson = localStorage.getItem('readChapters_other');
  // 如果有存储，则解析 JSON 并转换为 Set，否则返回空的 Set
  return readChaptersJson ? new Set(JSON.parse(readChaptersJson)) : new Set();
}

// 标记章节为已读并保存 (现在存储的是文件路径)
function markChapterAsRead(index) {
  const readChapters = getReadChapters();
  // 存储 chapter 的唯一标识符 (file)
  readChapters.add(chapters[index].file); 
  localStorage.setItem('readChapters_other', JSON.stringify(Array.from(readChapters)));
}
  
// 渲染章节列表
function renderChapterList(){
    // 1. 根据搜索框内容过滤章节
    const query = chapterSearchInput.value.toLowerCase().trim();
    if (query) {
        // 如果有搜索词，则过滤标题包含关键词的章节
        filteredChapters = chapters.filter(chap => chap.title.toLowerCase().includes(query));
    } else {
        // 否则显示全部章节
        filteredChapters = chapters;
    }
  
    chapterList.innerHTML = "";

    const totalChapters = filteredChapters.length;
    const start = currentPage * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, totalChapters);
    
    // 获取已读章节列表
    const readChapters = getReadChapters(); 

    for(let i=start; i<end; i++){
        const chapter = filteredChapters[i]; // 获取当前章节对象
        const originalIndex = chapters.findIndex(c => c.file === chapter.file);        
        const li = document.createElement('li');
        li.className = "chapter-item";
        
        // 标题
        const a = document.createElement('a');
        a.className = "chapter-title";
        a.textContent = chapter.title;
        
        // 点击事件：使用原始索引调用 loadChapter
        a.addEventListener('click', () => { 
            if (originalIndex !== -1) {
                loadChapter(originalIndex); 
            }
        });
        
        // 检查是否已读并设置黑色
        // 检查 readChapters 集合中是否包含 chapter 的文件路径 
            if (readChapters.has(chapter.file)) {
            a.style.color = 'var(--read-color)';; 
            a.style.fontWeight = 'normal'; 
        } else {
            a.style.color = 'var(--link-color)'; // 替换为 CSS 变量
        }

        // 简介
        const desc = document.createElement('span');
        desc.className = "chapter-desc";
        desc.textContent = chapter.desc || "";
        li.appendChild(a);
        li.appendChild(desc);
        chapterList.appendChild(li);
    }
    renderPagination(); // 调用分页函数
}  

// 渲染分页按钮
function renderPagination(){
  paginationDiv.innerHTML = "";
  
  // 1. 计算总页数
  const totalChapters = filteredChapters.length;
  const totalPages = Math.ceil(totalChapters / PAGE_SIZE);

  if (totalPages <= 1) {
    paginationDiv.style.padding = '0';
    return;
  }
    
  // 当前页码（从 1 开始计数）
  const displayCurrentPage = currentPage + 1;
  
  // --- 通用样式 (使用 CSS 变量) ---
  const buttonStyle = `
    padding: 5px 10px; 
    margin: 0 5px; 
    cursor: pointer; 
    /* 💥 使用 CSS 变量 */
    border: 1px solid var(--nav-btn-border); 
    background: var(--nav-btn-bg); 
    color: var(--nav-btn-text);
    border-radius: 4px; 
    font-size: 14px;
    transition: background 0.3s, color 0.3s, border-color 0.3s;
  `;

  // --- 第一行容器：核心导航 (上一页 / 页码 / 下一页) ---
  const topRow = document.createElement('div');
  topRow.style.display = 'flex';
  topRow.style.justifyContent = 'center'; 
  topRow.style.alignItems = 'center';
  topRow.style.padding = '10px 0'; 
  
  // --- 创建【上一页】按钮 ---
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '上一页';
  prevBtn.style.cssText = buttonStyle;
  
  if (currentPage === 0) {
    prevBtn.disabled = true;
  } else {
    prevBtn.addEventListener('click', () => {
      currentPage = currentPage - 1;
      renderChapterList();
    });
  }
  topRow.appendChild(prevBtn);

  // --- 显示页码信息 ---
  const pageInfo = document.createElement('span');
  pageInfo.textContent = ` (${displayCurrentPage} / ${totalPages}) `;
  pageInfo.style.margin = '0 10px';  
  pageInfo.style.fontSize = '14px';
  // 💥 确保页码信息文字颜色正确
  pageInfo.style.color = 'var(--text-color)';
  topRow.appendChild(pageInfo);

  // --- 创建【下一页】按钮 ---
  const nextBtn = document.createElement('button');
  nextBtn.textContent = '下一页';
  nextBtn.style.cssText = buttonStyle;

  if (currentPage === totalPages - 1) {
    nextBtn.disabled = true;
  } else {
    nextBtn.addEventListener('click', () => {
      currentPage = currentPage + 1;
      renderChapterList();
    });
  }
  topRow.appendChild(nextBtn);
  
  // 将第一行添加到主容器
  paginationDiv.appendChild(topRow);
  
  // --- 第二行容器：跳转功能 ---
  const bottomRow = document.createElement('div');
  bottomRow.style.display = 'flex';
  bottomRow.style.justifyContent = 'center';  
  bottomRow.style.alignItems = 'center';
  bottomRow.style.paddingBottom = '15px'; 

  const jumpContainer = document.createElement('span');
  jumpContainer.style.fontSize = '14px';
  // 💥 确保文字颜色正确
  jumpContainer.style.color = 'var(--text-color)';
  jumpContainer.textContent = '跳转至: ';
  
  // 1. 输入框
  const pageInput = document.createElement('input');
  pageInput.type = 'number';
  pageInput.min = 1;
  pageInput.max = totalPages;
  pageInput.value = displayCurrentPage;
  // 💥 确保输入框样式使用 CSS 变量
  pageInput.style.cssText = `
    width: 40px; 
    text-align: center; 
    padding: 3px; 
    border: 1px solid var(--nav-btn-border); 
    background: var(--nav-btn-bg); 
    color: var(--nav-btn-text);
    border-radius: 3px; 
    margin-right: 5px; 
    font-size: 14px;
  `;
  
  // 2. 跳转按钮
  const jumpBtn = document.createElement('button');
  jumpBtn.textContent = 'Go';
  jumpBtn.style.cssText = buttonStyle;
  jumpBtn.style.margin = '0';  

  jumpBtn.addEventListener('click', () => {
    const targetPage = parseInt(pageInput.value);
    
    if (targetPage >= 1 && targetPage <= totalPages) {
      currentPage = targetPage - 1; 
      renderChapterList();
      window.scrollTo({top: 0, behavior: 'smooth'}); 
    } else {
      alert(`请输入一个有效的页码 (1 到 ${totalPages})。`);
      pageInput.value = displayCurrentPage;
    }
  });

  jumpContainer.appendChild(pageInput);
  jumpContainer.appendChild(jumpBtn);
  
  bottomRow.appendChild(jumpContainer);
  // 将第二行添加到主容器
  paginationDiv.appendChild(bottomRow);
}
  
// 加载文章内容
function loadChapter(index){
  const chapter = chapters[index]; // 获取当前章节对象
  const file = chapter.file;
  currentChapterIndex = index;

  // --- 限制级检查逻辑 (保持不变) ---
  let loadPromise;
  if (chapter.restricted) {
    loadPromise = showRestrictedWarning().then(() => {
        return fetch(file);
    }).catch(() => {
        return Promise.reject('用户取消阅读限制级内容');
    });
  } else {
    loadPromise = fetch(file);
  }
  // ----------------------------------
  
  loadPromise
    .then(res => res.text())
    .then(text => {
      const paragraphs = text.split('\n').filter(line=>line.trim()!=='');
      
      const styledContent = paragraphs.map(p => {
        return `<p style="
         line-height: 1.8;
          font-size: 16px;
          color: var(--text-color); /* 替换为 CSS 变量 */
          margin-bottom: 1.5em;
          text-align: justify;
          font-family: 'Microsoft YaHei', sans-serif;
        ">${p}</p>`;
      }).join('');
      
      contentDiv.innerHTML = styledContent + renderNavButtons();
      
      // 加载文章成功后，显示评论区
      document.getElementById('vcomments').style.display = 'block';
      
      // 加入 Valine
      loadValine(chapters[index].file);
      
      // 滚动到内容顶部
      window.scrollTo({top:contentDiv.offsetTop-20, behavior:'smooth'});

      // 标记为已读并刷新列表
      markChapterAsRead(index);
      renderChapterList();



    })
    .catch(err => {
        if (err !== '用户取消阅读限制级内容') {
             contentDiv.innerHTML = '加载失败：' + err;
        }
    });
}

  
// 渲染底部导航栏
function renderNavButtons(){
  const prevIndex = currentChapterIndex > 0 ? currentChapterIndex - 1 : null;
  const nextIndex = currentChapterIndex < chapters.length - 1 ? currentChapterIndex + 1 : null;

  const prevTitle = prevIndex !== null ? chapters[prevIndex].title : "";
  const nextTitle = nextIndex !== null ? chapters[nextIndex].title : "";
  const currentTitle = chapters[currentChapterIndex].title || "";
  const titleMaxWidth = '80px'; 

  return `
    <div style="text-align:center;font-size:12px;color:#999;margin:10px 0 10px 0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:200px;margin-left:auto;margin-right:auto;">
      当前文章：${currentTitle}
    </div>

    <div style="padding:15px 10px;border-top:1px solid #e6e6e6;display:flex;justify-content: center;
    align-items:flex-end;font-size:14px;color:#666;">

      <div style="width:33%; display:flex;flex-direction:column;align-items:flex-start;box-sizing: border-box; ">
        ${prevIndex !== null ? `
          <div style="font-size:12px;color:#999;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
          max-width:${titleMaxWidth}; 
          ">${prevTitle}</div>
          <button style="padding:8px 12px; 
          font-size:14px; 
          cursor:pointer; 
          border-radius:6px; 
          /* 💥 替换硬编码颜色 */
          border:1px solid var(--nav-btn-border); 
          background:var(--nav-btn-bg);
          color:var(--nav-btn-text);
          " onclick="loadChapter(${prevIndex})">上一篇</button>
        ` : `<div style="height:32px;"></div>`}
      </div>

      <div style="width:34%; display:flex;flex-direction:column;align-items:center;box-sizing: border-box; ">
        <button style="padding:8px 12px; 
        font-size:14px; 
        cursor:pointer; 
        border-radius:6px; 
         /* 💥 替换硬编码颜色 */
        border:1px solid var(--nav-btn-border); 
        background:var(--nav-btn-bg);
        color:var(--nav-btn-text);
        " onclick="contentDiv.innerHTML='请选择标题开始阅读';
        // 💥 新增：点击返回目录时，隐藏评论区
        document.getElementById('vcomments').style.display='none';
        window.scrollTo({top:0, behavior:'smooth'});
         ">返回目录</button>
      </div>

      <div style="width:33%; display:flex;flex-direction:column;align-items:flex-end;box-sizing: border-box; ">
        ${nextIndex !== null ? `
          <div style="font-size:12px;color:#999;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
          max-width:${titleMaxWidth}; text-align:right;">${nextTitle}</div>
          <button style="padding:8px 12px; 
          font-size:14px; 
          cursor:pointer; 
          border-radius:6px; 
         /* 💥 替换硬编码颜色 */
          border:1px solid var(--nav-btn-border); 
          background:var(--nav-btn-bg);
          color:var(--nav-btn-text);
          " onclick="loadChapter(${nextIndex})">下一篇</button>
        ` : `<div style="height:32px;"></div>`}
      </div>
    </div>
  `;
}

// --- 搜索框事件监听器 ---
if (chapterSearchInput) {
    chapterSearchInput.addEventListener('input', () => {
        // 当输入变化时，将页码重置为第一页，然后重新渲染列表
        currentPage = 0; 
        renderChapterList();
    });
}

// 核心函数：切换模式并保存状态
function toggleMode() {
    const body = document.body;
    // 切换 body 上的 dark-mode class
    body.classList.toggle('dark-mode');
    
    // 保存用户的选择到 localStorage
    const isDarkMode = body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');

    // 更新按钮文字和样式
    const modeToggleBtn = document.getElementById('modeToggle');
    if (isDarkMode) {
        modeToggleBtn.textContent = '☀️ 白天模式';
        // 按钮背景和文字颜色反转，使用硬编码颜色以保持按钮独立性
        modeToggleBtn.style.background = '#444';
        modeToggleBtn.style.color = '#fff';
        modeToggleBtn.style.borderColor = '#666';
    } else {
        modeToggleBtn.textContent = '🌙 夜间模式';
        modeToggleBtn.style.background = '#fff';
        modeToggleBtn.style.color = '#333';
        modeToggleBtn.style.borderColor = '#ccc';
    }
    // 每次切换模式后，重新渲染章节列表，确保标题颜色正确应用 CSS 变量
    renderChapterList();
}

// 页面加载时：检查用户上次的选择并绑定点击事件
document.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('theme');
    const modeToggleBtn = document.getElementById('modeToggle');

    // 检查并设置初始模式
    if (savedTheme === 'dark') {
        // 如果保存过夜间模式，则加载它
        // 注意：这里不能直接调用 toggleMode()，因为 toggleMode() 默认会切换状态。
        // 我们需要手动设置 dark-mode class 和按钮样式
        document.body.classList.add('dark-mode');
        modeToggleBtn.textContent = '☀️ 白天模式';
        modeToggleBtn.style.background = '#444';
        modeToggleBtn.style.color = '#fff';
        modeToggleBtn.style.borderColor = '#666';
    } else {
         // 确保按钮显示默认的夜间模式提示
         modeToggleBtn.textContent = '🌙 夜间模式';
         modeToggleBtn.style.background = '#fff';
         modeToggleBtn.style.color = '#333';
         modeToggleBtn.style.borderColor = '#ccc';
    }

    // 绑定点击事件
    modeToggleBtn.addEventListener('click', toggleMode);
});


// 初始化
renderChapterList();

</script>
