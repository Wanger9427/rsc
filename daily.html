<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>【袁成】老A日常系列</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      background-color: #fdfdfd;
      color: #333;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      background-color: #1a73e8;
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-size: 26px;
    }

    main {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
    }

    #chapterList {
      list-style: none;
      padding-left: 0;
      margin-bottom: 30px;
    }

    #chapterList li {
      margin-bottom: 12px;
    }

    #chapterList a {
      text-decoration: none;
      color: #1a73e8;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    #chapterList a:hover {
      text-decoration: underline;
    }

    #content {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #f5f5f5;
      min-height: 200px;
    }

    #content p {
      margin-bottom: 16px;
    }

    @media (max-width: 500px) {
      #chapterList a {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>【袁成】老A日常系列</h1>
  <p>点击标题阅读对应短篇文</p>
</header>

<main>
  <ul id="chapterList">
    <!-- 在这里添加章节标题 -->
    <!-- 格式：<li><a data-file="对应txt文件名">标题</a></li> -->
    <li><a data-file="Dogs, Humans, Heat, and Public Order(1).txt">狗、人、发情与公共秩序（上）</a></li>
    <li><a data-file="Dogs, Humans, Heat, and Public Order(2).txt">狗、人、发情与公共秩序（上）</a></li>
    <!-- 后续文档可继续添加 -->
  </ul>

  <div id="content">请选择标题开始阅读</div>
</main>

<script>
  const links = document.querySelectorAll('#chapterList a');
  const contentDiv = document.getElementById('content');

  links.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const file = link.getAttribute('data-file');

      fetch(file)
        .then(response => response.text())
        .then(text => {
          const paragraphs = text.split('\n').filter(line => line.trim() !== '');
          contentDiv.innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
          // 滚动到内容顶部
          window.scrollTo({ top: contentDiv.offsetTop - 20, behavior: 'smooth' });
        })
        .catch(err => {
          contentDiv.innerHTML = '加载失败：' + err;
        });
    });
  });
</script>

</body>
</html>
