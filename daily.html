<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>【袁成】老A日常系列</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family:"Microsoft YaHei",sans-serif; background:#fdfdfd; color:#333; margin:0; padding:0; }
  header { text-align:center; padding:30px 20px; background:#1a73e8; color:#fff; }
  header h1 { margin:0; font-size:26px; }
  main { max-width:800px; margin:20px auto; padding:0 20px; }
  /* ===章节列表=== */
  #chapterList { list-style:none; padding-left:0; margin-bottom:20px; }
  /* 每一行：改为上下结构，不再侧向排布 */
  .chapter-item {margin-bottom:14px;}
  /* 标题 */
  .chapter-title {display:block;text-decoration:none;color:#1a73e8;font-weight:bold;cursor:pointer;font-size:17px;}
  .chapter-title:hover {text-decoration:underline;}
  /* 简介：放在标题下方 */
  .chapter-desc {display:block;margin-top:4px;font-size:13px;color:#888;line-height:1.4;}
  /* 分页 */
  #pagination { text-align:center; margin-top:15px; }
  #pagination button { margin:0 3px; padding:5px 10px; cursor:pointer; }
  /* 内容框 */
  #content { padding:20px; border:1px solid #ddd; border-radius:10px; background:#f5f5f5; min-height:200px; margin-top:20px; }
  #content p { margin-bottom:16px; }
</style>

</head>
<body>

<header>
  <h1>【袁成】老A日常系列</h1>
  <p>点击标题阅读对应短篇文</p>
  <div style="margin-top:10px;">
    <a href="index.html" style="margin-right:15px; color:#fff; background:#555; padding:5px 10px; border-radius:5px; text-decoration:none;">返回首页</a>
    <a href="science.html" style="margin-right:10px; color:#fff; background:#888; padding:5px 10px; border-radius:5px; text-decoration:none;">老A版《走近科学》</a>
    <a href="shorts.html" style="color:#fff; background:#888; padding:5px 10px; border-radius:5px; text-decoration:none;">短篇文</a>
  </div>
</header>

<main>
  <ul id="chapterList"></ul>
  <div id="pagination"></div>
  <div id="content">请选择标题开始阅读</div>
</main>

<script>
const chapters = [  
  {title:"合规接触", file:"daily/Authorized Contact.txt",desc:"成才一个腿软被调戏的故事"},
  {title:"非战术性误导的澄清纪要（一）", file:"daily/Clarification Report(1).txt",desc:"由于吴哲经常看见狗血场面，他终于开始造谣了"},
  {title:"非战术性误导的澄清纪要（二）", file:"daily/Clarification Report(2).txt"},
  {title:"非战术性误导的澄清纪要（三）", file:"daily/Clarification Report(3).txt"},
  {title:"狗、人、发情与公共秩序（上）", file:"daily/Dogs, Humans, Heat, and Public Order(1).txt",desc:"一条狗引发的袁朗发疯事件"},
  {title:"狗、人、发情与公共秩序（下）", file:"daily/Dogs, Humans, Heat, and Public Order(2).txt"},
  {title:"案例报告：老A精神状态全面崩溃", file:"daily/Case Report: Total Mental Collapse of Unit A.txt",desc:"一锅鸡汤引发的老A全员精神错乱"},
  {title:"情报泄露与内部风控失效（上）", file:"daily/Information Leakage and Failure of Internal Controls(1).txt"},
  {title:"情报泄露与内部风控失效（下）", file:"daily/Information Leakage and Failure of Internal Controls(2).txt"},
  {title:"士兵情感行为可控边界测试（一）", file:"daily/Soldier Emotional(1).txt"},
  {title:"士兵情感行为可控边界测试（二）", file:"daily/Soldier Emotional(2).txt"},
  {title:"士兵情感行为可控边界测试（三）", file:"daily/Soldier Emotional(3).txt"},
  {title:"士兵情感行为可控边界测试（四）", file:"daily/Soldier Emotional(4).txt"},
];

const PAGE_SIZE = 15; // 每页显示 15 篇文章
let currentPage = 0;
const chapterList = document.getElementById('chapterList');
const paginationDiv = document.getElementById('pagination');
const contentDiv = document.getElementById('content');
let currentChapterIndex = 0;

// 渲染章节列表
function renderChapterList(){
  chapterList.innerHTML = "";
  const start = currentPage * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, chapters.length);
  for(let i=start; i<end; i++){
    const li = document.createElement('li');
    li.className = "chapter-item";
    // 标题
    const a = document.createElement('a');
    a.className = "chapter-title";
    a.textContent = chapters[i].title;
    a.addEventListener('click', () => { loadChapter(i); });
    // 简介（如果没有给简介，则设为空字符串）
    const desc = document.createElement('span');
    desc.className = "chapter-desc";
    desc.textContent = chapters[i].desc || "";
    li.appendChild(a);
    li.appendChild(desc);
    chapterList.appendChild(li);
  }
  renderPagination();
}

// 渲染分页按钮
function renderPagination(){
  paginationDiv.innerHTML = "";
  const totalPages = Math.ceil(chapters.length / PAGE_SIZE);
  for(let i=0;i<totalPages;i++){
    const btn = document.createElement('button');
    btn.textContent = i+1;
    if(i===currentPage) btn.disabled = true;
    btn.addEventListener('click',()=>{currentPage=i; renderChapterList();});
    paginationDiv.appendChild(btn);
  }
}

// 加载文章内容
function loadChapter(index){
  const file = chapters[index].file;
  currentChapterIndex = index;
  fetch(file)
    .then(res=>res.text())
    .then(text=>{
      const paragraphs = text.split('\n').filter(line=>line.trim()!=='');
      contentDiv.innerHTML = paragraphs.map(p=>`<p>${p}</p>`).join('') + renderNavButtons();
      window.scrollTo({top:contentDiv.offsetTop-20, behavior:'smooth'});
    })
    .catch(err=>contentDiv.innerHTML = '加载失败：'+err);
}

// 渲染底部导航栏
function renderNavButtons(){
  const prevIndex = currentChapterIndex > 0 ? currentChapterIndex - 1 : null;
  const nextIndex = currentChapterIndex < chapters.length - 1 ? currentChapterIndex + 1 : null;

  const prevTitle = prevIndex !== null ? chapters[prevIndex].title : "";
  const nextTitle = nextIndex !== null ? chapters[nextIndex].title : "";
  const currentTitle = chapters[currentChapterIndex].title || "";

  return `
    <!-- 当前文章提示行 -->
    <div style="
      text-align:center;
      font-size:12px;
      color:#999;
      margin:10px 0 8px 0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:200px;
      margin-left:auto;
      margin-right:auto;
    ">
      当前文章：${currentTitle}
    </div>

    <!-- 底部三栏导航按钮 -->
    <div style="
      padding:18px 10px;
      border-top:1px solid #e6e6e6;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
      color:#666;
    ">

      <!-- 左栏：上一篇 -->
      <div style="
        width:33%;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:flex-start;
      ">
        ${prevIndex !== null ? `
          <div style="
            font-size:12px;
            color:#999;
            margin-bottom:6px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            max-width:100px;
          ">${prevTitle}</div>
          <button onclick="loadChapter(${prevIndex})"
            style="padding:8px 14px; font-size:14px; cursor:pointer; border-radius:6px; border:1px solid #ccc; background:#fff;">
            上一篇
          </button>
        ` : `<div style="height:32px;"></div>`}
      </div>

      <!-- 中栏：返回目录 -->
      <div style="
        width:34%;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
      ">
        <button onclick="
          contentDiv.innerHTML='请选择标题开始阅读';
          window.scrollTo({top:0, behavior:'smooth'});
        " style="padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; border-radius:6px; border:1px solid #bbb; background:#fff;">
          返回目录
        </button>
      </div>

      <!-- 右栏：下一篇 -->
      <div style="
        width:33%;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:flex-end;
      ">
        ${nextIndex !== null ? `
          <div style="
            font-size:12px;
            color:#999;
            margin-bottom:6px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            max-width:100px;
            text-align:right;
          ">${nextTitle}</div>
          <button onclick="loadChapter(${nextIndex})"
            style="padding:8px 14px; font-size:14px; cursor:pointer; border-radius:6px; border:1px solid #ccc; background:#fff;">
            下一篇
          </button>
        ` : `<div style="height:32px;"></div>`}
      </div>

    </div>
  `;
}

// 初始化
renderChapterList();
</script>

</body>
</html>
