<script>
const chapters = [  
  {title:"【齐哲】一墙之隔", file:"other/one wall.txt",desc:"【限制】袁成背景下的齐哲，齐桓和吴哲撞见袁成之后，齐桓有些躁动，吴哲陪他冷静下来。",restricted: true},  
  {title:"【袁高成】三人行（一）", file:"other/three(1).txt",desc:"【限制】人设崩坏，无逻辑，无三观，内容也很黄暴无脑降智，前半黄暴后半降智，是袁高两只舔狗疯狂舔成才的故事。请谨慎观看，真的很雷。",restricted: true},
  {title:"【袁高成】三人行（二）", file:"other/three(2).txt",restricted: true},
  {title:"【袁高成】三人行（三）", file:"other/three(3).txt",restricted: true},
  {title:"【袁高成】三人行（四）", file:"other/three(4).txt",restricted: true},
  {title:"【袁高成】三人行（五）", file:"other/three(5).txt",restricted: true},
  {title:"【袁高成】三人行（六）", file:"other/three(6).txt",restricted: true},
  {title:"【袁高成】三人行（七）", file:"other/three(7).txt",restricted: true},
  {title:"【袁高成】三人行（八）", file:"other/three(8).txt"},

];

const PAGE_SIZE = 10; // 每页显示 10 篇文章
let currentPage = 0;
const chapterList = document.getElementById('chapterList');
const paginationDiv = document.getElementById('pagination');
const contentDiv = document.getElementById('content');
let currentChapterIndex = 0;

// 限制级提示弹窗
/**
 * 弹出限制级内容警告，并返回一个 Promise。
 * 用户点击“确认”则 resolve，点击“取消”则 reject。
 */
function showRestrictedWarning() {
    return new Promise((resolve, reject) => {
        const message = "警告：此章节包含限制级内容，请确定您已年满18岁。";
        // 使用 confirm 弹出原生弹窗
        if (window.confirm(message)) {
            resolve(); // 用户点击“确认”
        } else {
            reject(); // 用户点击“取消”
        }
    });
}

// --- 新增搜索功能变量和元素引用 ---
const chapterSearchInput = document.getElementById('chapterSearch');
let filteredChapters = chapters; // 初始时，过滤后的列表等于全部列表
// ------------------------------------

// 获取已读章节索引的集合 (从浏览器存储中读取)
function getReadChapters() {
  const readChaptersJson = localStorage.getItem('readChapters');
  // 如果有存储，则解析 JSON 并转换为 Set，否则返回空的 Set
  return readChaptersJson ? new Set(JSON.parse(readChaptersJson)) : new Set();
}

// 标记章节为已读并保存 (保存到浏览器存储中)
function markChapterAsRead(index) {
  const readChapters = getReadChapters();
  // 使用当前章节在 chapters 数组中的索引作为标识符
  readChapters.add(index); 
  // 将 Set 转换回数组并存储为 JSON 字符串
  localStorage.setItem('readChapters', JSON.stringify(Array.from(readChapters)));
}
  
// 渲染章节列表
function renderChapterList(){
    // 1. 根据搜索框内容过滤章节
    const query = chapterSearchInput.value.toLowerCase().trim();
    if (query) {
        // 如果有搜索词，则过滤标题包含关键词的章节
        filteredChapters = chapters.filter(chap => chap.title.toLowerCase().includes(query));
    } else {
        // 否则显示全部章节
        filteredChapters = chapters;
    }

    chapterList.innerHTML = "";

    const totalChapters = filteredChapters.length;
    const start = currentPage * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, totalChapters);
    
    // 获取已读章节列表
    const readChapters = getReadChapters(); 

    for(let i=start; i<end; i++){
        const chapter = filteredChapters[i]; // 获取当前章节对象
        const originalIndex = chapters.findIndex(c => c.file === chapter.file);
        
        const li = document.createElement('li');
        li.className = "chapter-item";
        
        // 标题
        const a = document.createElement('a');
        a.className = "chapter-title";
        a.textContent = chapter.title;
        
        // 点击事件：使用原始索引调用 loadChapter
        a.addEventListener('click', () => { 
            if (originalIndex !== -1) {
                loadChapter(originalIndex); 
            }
        });
        
        // 检查是否已读并设置黑色
        if (originalIndex !== -1 && readChapters.has(originalIndex)) {
            a.style.color = '#000000'; 
            a.style.fontWeight = 'normal'; 
        } else {
            a.style.color = '#337ab7'; // 未读标题颜色
        }

        // 简介
        const desc = document.createElement('span');
        desc.className = "chapter-desc";
        desc.textContent = chapter.desc || "";
        li.appendChild(a);
        li.appendChild(desc);
        chapterList.appendChild(li);
    }
    renderPagination(); // 调用分页函数
}  

// 渲染分页按钮
function renderPagination(){
  paginationDiv.innerHTML = "";
  
  // 1. 计算总页数
  const totalChapters = filteredChapters.length;
  const totalPages = Math.ceil(totalChapters / PAGE_SIZE);

  if (totalPages <= 1) {
    paginationDiv.style.padding = '0';
    return;
  }
    
  // 当前页码（从 1 开始计数）
  const displayCurrentPage = currentPage + 1;
  
  // --- 通用样式 ---
  const buttonStyle = 'padding: 5px 10px; margin: 0 5px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 14px;';

  // --- 第一行容器：核心导航 (上一页 / 页码 / 下一页) ---
  const topRow = document.createElement('div');
  topRow.style.display = 'flex';
  topRow.style.justifyContent = 'center'; // 居中显示
  topRow.style.alignItems = 'center';
  topRow.style.padding = '10px 0'; // 顶部和底部的内边距
  
  // --- 创建【上一页】按钮 ---
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '上一页';
  prevBtn.style.cssText = buttonStyle;
  
  if (currentPage === 0) {
    prevBtn.disabled = true;
  } else {
    prevBtn.addEventListener('click', () => {
      currentPage = currentPage - 1;
      renderChapterList();
    });
  }
  topRow.appendChild(prevBtn);

  // --- 显示页码信息 ---
  const pageInfo = document.createElement('span');
  pageInfo.textContent = ` (${displayCurrentPage} / ${totalPages}) `;
  pageInfo.style.margin = '0 10px'; 
  pageInfo.style.fontSize = '14px';
  topRow.appendChild(pageInfo);

  // --- 创建【下一页】按钮 ---
  const nextBtn = document.createElement('button');
  nextBtn.textContent = '下一页';
  nextBtn.style.cssText = buttonStyle;

  if (currentPage === totalPages - 1) {
    nextBtn.disabled = true;
  } else {
    nextBtn.addEventListener('click', () => {
      currentPage = currentPage + 1;
      renderChapterList();
    });
  }
  topRow.appendChild(nextBtn);
  
  // 将第一行添加到主容器
  paginationDiv.appendChild(topRow);
  
  // --- 第二行容器：跳转功能 ---
  const bottomRow = document.createElement('div');
  bottomRow.style.display = 'flex';
  bottomRow.style.justifyContent = 'center'; 
  bottomRow.style.alignItems = 'center';
  bottomRow.style.paddingBottom = '15px'; 

  const jumpContainer = document.createElement('span');
  jumpContainer.style.fontSize = '14px';
  jumpContainer.textContent = '跳转至: ';
  
  // 1. 输入框
  const pageInput = document.createElement('input');
  pageInput.type = 'number';
  pageInput.min = 1;
  pageInput.max = totalPages;
  pageInput.value = displayCurrentPage;
  pageInput.style.cssText = 'width: 40px; text-align: center; padding: 3px; border: 1px solid #ccc; border-radius: 3px; margin-right: 5px; font-size: 14px;';
  
  // 2. 跳转按钮
  const jumpBtn = document.createElement('button');
  jumpBtn.textContent = 'Go';
  jumpBtn.style.cssText = buttonStyle;
  jumpBtn.style.margin = '0'; 

  jumpBtn.addEventListener('click', () => {
    const targetPage = parseInt(pageInput.value);
    
    if (targetPage >= 1 && targetPage <= totalPages) {
      currentPage = targetPage - 1; 
      renderChapterList();
      window.scrollTo({top: 0, behavior: 'smooth'}); 
    } else {
      alert(`请输入一个有效的页码 (1 到 ${totalPages})。`);
      pageInput.value = displayCurrentPage;
    }
  });

  jumpContainer.appendChild(pageInput);
  jumpContainer.appendChild(jumpBtn);
  
  bottomRow.appendChild(jumpContainer);
  // 将第二行添加到主容器
  paginationDiv.appendChild(bottomRow);
}
  
// 加载文章内容
function loadChapter(index){
  const chapter = chapters[index]; // 获取当前章节对象
  const file = chapter.file;
  currentChapterIndex = index;

  // --- 限制级检查逻辑 (保持不变) ---
  let loadPromise;
  if (chapter.restricted) {
    loadPromise = showRestrictedWarning().then(() => {
        return fetch(file);
    }).catch(() => {
        return Promise.reject('用户取消阅读限制级内容');
    });
  } else {
    loadPromise = fetch(file);
  }
  // ----------------------------------
  
  loadPromise
    .then(res => res.text())
    .then(text => {
      const paragraphs = text.split('\n').filter(line=>line.trim()!=='');
      
      const styledContent = paragraphs.map(p => {
        return `<p style="
          line-height: 1.8;
          font-size: 16px;
          color: #333;
          margin-bottom: 1.5em;
          text-align: justify;
          font-family: 'Microsoft YaHei', sans-serif;
        ">${p}</p>`;
      }).join('');
      
      contentDiv.innerHTML = styledContent + renderNavButtons();
      
      // 加入 Valine
      loadValine(chapters[index].file);
      
      // 滚动到内容顶部
      window.scrollTo({top:contentDiv.offsetTop-20, behavior:'smooth'});

      // 标记为已读并刷新列表
      markChapterAsRead(index);
      renderChapterList();
      
      // ===================================
      // 💥 GA4 细致统计代码 💥
      // 检查 gtag 函数是否可用 (即 GA 代码是否已加载)
      if (typeof gtag === 'function') {
          const chapterTitle = chapters[index].title;
          
          gtag('event', 'read_chapter', { // 发送名为 'read_chapter' 的事件
              'chapter_title': chapterTitle, // 附加章节标题参数
              'chapter_index': index,        // 附加章节索引参数
              'event_category': 'Novel_Read' // 可选：添加分类
          });
      }
      // ===================================

    })
    .catch(err => {
        if (err !== '用户取消阅读限制级内容') {
             contentDiv.innerHTML = '加载失败：' + err;
        }
    });
}
  
// 渲染底部导航栏
function renderNavButtons(){
  const prevIndex = currentChapterIndex > 0 ? currentChapterIndex - 1 : null;
  const nextIndex = currentChapterIndex < chapters.length - 1 ? currentChapterIndex + 1 : null;

  const prevTitle = prevIndex !== null ? chapters[prevIndex].title : "";
  const nextTitle = nextIndex !== null ? chapters[nextIndex].title : "";
  const currentTitle = chapters[currentChapterIndex].title || "";
  const titleMaxWidth = '80px'; 

  return `
    <div style="text-align:center;font-size:12px;color:#999;margin:10px 0 10px 0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:200px;margin-left:auto;margin-right:auto;">
      当前文章：${currentTitle}
    </div>

    <div style="padding:15px 10px;border-top:1px solid #e6e6e6;display:flex;justify-content:space-between;align-items:flex-end;font-size:14px;color:#666;">

      <div style="width:33%; display:flex;flex-direction:column;align-items:flex-start;box-sizing: border-box; ">
        ${prevIndex !== null ? `
          <div style="font-size:12px;color:#999;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
          max-width:${titleMaxWidth}; 
          ">${prevTitle}</div>
          <button style="padding:8px 12px; font-size:14px; cursor:pointer; border-radius:6px; border:1px solid #ccc; 
          background:#fff;" onclick="loadChapter(${prevIndex})">上一篇</button>
        ` : `<div style="height:32px;"></div>`}
      </div>

      <div style="width:34%; display:flex;flex-direction:column;align-items:center;box-sizing: border-box; ">
        <button style="padding:8px 12px; font-size:14px; cursor:pointer; border-radius:6px; border:1px solid #bbb; background:#fff;
        " onclick="contentDiv.innerHTML='请选择标题开始阅读';window.scrollTo({top:0, behavior:'smooth'});">返回目录</button>
      </div>

      <div style="width:33%; display:flex;flex-direction:column;align-items:flex-end;box-sizing: border-box; ">
        ${nextIndex !== null ? `
          <div style="font-size:12px;color:#999;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
          max-width:${titleMaxWidth}; text-align:right;">${nextTitle}</div>
          <button style="padding:8px 12px; font-size:14px; cursor:pointer; border-radius:6px; border:1px solid #ccc; background:#fff;" 
          onclick="loadChapter(${nextIndex})">下一篇</button>
        ` : `<div style="height:32px;"></div>`}
      </div>

    </div>
  `;
}

// --- 搜索框事件监听器 ---
if (chapterSearchInput) {
    chapterSearchInput.addEventListener('input', () => {
        // 当输入变化时，将页码重置为第一页，然后重新渲染列表
        currentPage = 0; 
        renderChapterList();
    });
}
// -----------------------

// 初始化
renderChapterList();
</script>

<!-- Valine -->
<script src="https://cdn.jsdelivr.net/npm/valine/dist/Valine.min.js"></script>
<script>
/**
 * loadValine(path)
 * path: 用于区分每篇文章的唯一字符串（建议使用文章 file 路径）
 * 每次加载新文章时调用一次，Valine 会基于 path 展示/存储该文章的评论
 */
function loadValine(path) {
  const container = document.getElementById('vcomments');
   container.style.display = 'block';  //显示评论区
  container.innerHTML = '';  // 清空原有评论区（防止重复）

new Valine({
